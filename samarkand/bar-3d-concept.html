<title>Самарканд — бар 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, title chip top-left, control bar bottom. Single warm-dark look by choice. */
:root {
  --bg: #17110d;
  --panel: rgba(28, 20, 15, 0.82);
  --line: rgba(232, 196, 150, 0.22);
  --fg: #f1e4d2;
  --muted: #b9a58c;
  --accent: #d9874f;
  --accent-ink: #1a110b;
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Manrope", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.chip {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: flex; flex-direction: column; gap: 2px;
}
.chip h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.7rem; letter-spacing: 0.01em; text-wrap: balance; text-shadow: 0 1px 12px rgba(0,0,0,.6); }
.chip p { margin: 0; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.group { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: 100%; }
.group button {
  font: 600 0.82rem var(--body); color: var(--fg); background: transparent;
  border: 0; border-radius: 9px; padding: 9px 12px; cursor: pointer;
}
.group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 0.74rem; text-shadow: 0 1px 8px rgba(0,0,0,.8); }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>

<div id="stage"></div>
<div class="chip">
  <h1>Самарканд · барная зона</h1>
  <p>Концепт-модель по референсу · размеры в метрах</p>
</div>
<div class="bar">
  <div class="group" id="views" role="group" aria-label="Ракурс">
    <button id="v-overview" data-view="overview" aria-pressed="true">Общий</button>
    <button id="v-bar" data-view="bar" aria-pressed="false">Стойка</button>
    <button id="v-side" data-view="side" aria-pressed="false">Сбоку</button>
    <button id="v-top" data-view="top" aria-pressed="false">План</button>
  </div>
  <div class="group" id="modes" role="group" aria-label="Свет">
    <button id="m-evening" data-mode="evening" aria-pressed="true">Вечер</button>
    <button id="m-day" data-mode="day" aria-pressed="false">День</button>
  </div>
  <div class="hint">Вращайте одним пальцем, приближайте двумя</div>
</div>
<div id="err" hidden>WebGL недоступен в этом браузере. Откройте страницу в Chrome или Safari.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  if (!window.THREE) { document.getElementById('err').hidden = false; return; }

  // ---------- helpers ----------
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(12);
  function canvasTex(w, h, draw, repeat) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (repeat) t.repeat.set(repeat[0], repeat[1]);
    return t;
  }

  // ---------- renderer ----------
  var stage = document.getElementById('stage');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (e) { document.getElementById('err').hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17110d);
  var camera = new THREE.PerspectiveCamera(55, 1, 0.05, 50);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxDistance = 9; controls.minDistance = 0.4;
  controls.maxPolarAngle = Math.PI * 0.495;

  // soft warm environment for metal reflections
  (function () {
    var env = new THREE.Scene();
    var g = new THREE.BoxGeometry(1, 1, 1);
    function lamp(col, x, y, z, s) { var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col })); m.position.set(x, y, z); m.scale.set(s[0], s[1], s[2]); env.add(m); }
    env.background = new THREE.Color(0x2a1a10);
    lamp(0xffc58a, 0, 4, 0, [6, .2, 6]); lamp(0xff9a55, -4, 1, 0, [.2, 2, 4]); lamp(0xffe2bd, 4, 1.5, -2, [.2, 2, 2]);
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.04).texture;
  })();

  // ---------- textures ----------
  var plasterTex = canvasTex(512, 512, function (x, w, h) {
    x.fillStyle = '#bf9f7c'; x.fillRect(0, 0, w, h);
    for (var i = 0; i < 2600; i++) {
      var r = 2 + R() * 18, l = R() < .5;
      x.fillStyle = l ? 'rgba(255,240,220,' + (R() * .08) + ')' : 'rgba(120,85,55,' + (R() * .07) + ')';
      x.beginPath(); x.arc(R() * w, R() * h, r, 0, 7); x.fill();
    }
  }, [1, 1]);

  var floorTex = canvasTex(1024, 1024, function (x, w, h) {
    x.fillStyle = '#8f8476'; x.fillRect(0, 0, w, h);
    var s = 256;
    for (var i = 0; i < 4; i++) for (var j = 0; j < 4; j++) {
      var v = 175 + R() * 30 | 0;
      x.fillStyle = 'rgb(' + v + ',' + (v - 8) + ',' + (v - 22) + ')';
      x.fillRect(i * s + 3, j * s + 3, s - 6, s - 6);
      for (var k = 0; k < 500; k++) {
        x.fillStyle = 'rgba(' + (R() < .5 ? '255,250,240' : '90,80,70') + ',' + R() * .12 + ')';
        x.beginPath(); x.arc(i * s + 3 + R() * (s - 6), j * s + 3 + R() * (s - 6), R() * 7, 0, 7); x.fill();
      }
    }
  }, [3, 2.6]);

  function woodTex(base, dark) {
    return canvasTex(256, 1024, function (x, w, h) {
      x.fillStyle = base; x.fillRect(0, 0, w, h);
      for (var i = 0; i < 140; i++) {
        x.strokeStyle = dark; x.globalAlpha = .08 + R() * .2; x.lineWidth = .5 + R() * 2.5;
        var px = R() * w; x.beginPath(); x.moveTo(px, 0);
        for (var y = 0; y <= h; y += 64) x.lineTo(px + Math.sin(y * .01 + i) * 6, y);
        x.stroke();
      }
      x.globalAlpha = 1;
    });
  }
  var woodLight = woodTex('#8a5a36', '#3d2312');
  var woodDark = woodTex('#3a2618', '#140b05');

  // beaded lamp shade pattern
  var beadTex = canvasTex(1024, 256, function (x, w, h) {
    x.fillStyle = '#efe3cf'; x.fillRect(0, 0, w, h);
    var cols = ['#1f9aa6', '#c23a2b', '#1c2f5a', '#e2a33a'];
    // top saw-tooth band
    for (var i = 0; i < w; i += 32) { x.fillStyle = cols[1]; x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 16, 34); x.lineTo(i + 32, 0); x.fill(); }
    // diamonds row
    for (var d = 0; d < 8; d++) {
      var cx = d * 128 + 64, cy = 128;
      [[58, cols[2]], [44, cols[0]], [28, cols[1]], [12, cols[3]]].forEach(function (p) {
        x.fillStyle = p[1]; x.beginPath(); x.moveTo(cx, cy - p[0] * 1.3); x.lineTo(cx + p[0], cy); x.lineTo(cx, cy + p[0] * 1.3); x.lineTo(cx - p[0], cy); x.fill();
      });
      x.fillStyle = cols[0]; x.fillRect(cx + 54, cy - 6, 20, 12);
    }
    // bottom zigzag
    x.strokeStyle = cols[0]; x.lineWidth = 10; x.beginPath();
    for (var z = 0; z <= w; z += 24) x.lineTo(z, z % 48 ? 214 : 236);
    x.stroke();
    x.fillStyle = cols[2]; x.fillRect(0, 244, w, 12);
    // bead dots
    for (var by = 3; by < h; by += 8) for (var bx = (by / 8 % 2) * 4; bx < w; bx += 8) {
      x.fillStyle = 'rgba(255,255,255,.18)'; x.beginPath(); x.arc(bx, by, 2.2, 0, 7); x.fill();
      x.fillStyle = 'rgba(0,0,0,.12)'; x.beginPath(); x.arc(bx + 1, by + 1.5, 1.6, 0, 7); x.fill();
    }
  });

  // carpet
  var carpetTex = canvasTex(512, 768, function (x, w, h) {
    x.fillStyle = '#7d1d1a'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#1b2547'; x.fillRect(18, 18, w - 36, h - 36);
    x.fillStyle = '#e6d6b8'; x.fillRect(46, 46, w - 92, h - 92);
    x.fillStyle = '#9b2421'; x.fillRect(54, 54, w - 108, h - 108);
    // border motifs
    for (var i = 30; i < w - 30; i += 26) { x.fillStyle = '#d9b46a'; x.fillRect(i, 26, 10, 10); x.fillRect(i, h - 36, 10, 10); }
    for (var j = 30; j < h - 30; j += 26) { x.fillStyle = '#d9b46a'; x.fillRect(26, j, 10, 10); x.fillRect(w - 36, j, 10, 10); }
    function hex(cx, cy, s, c) { x.fillStyle = c; x.beginPath(); x.moveTo(cx, cy - s * 1.4); x.lineTo(cx + s, cy - s * .5); x.lineTo(cx + s, cy + s * .5); x.lineTo(cx, cy + s * 1.4); x.lineTo(cx - s, cy + s * .5); x.lineTo(cx - s, cy - s * .5); x.fill(); }
    [[w / 2, 210], [w / 2, 384], [w / 2, 558]].forEach(function (p, k) {
      hex(p[0], p[1], 92, '#1b2547'); hex(p[0], p[1], 74, '#e6d6b8'); hex(p[0], p[1], 56, k === 1 ? '#2a8a8c' : '#c84a2c'); hex(p[0], p[1], 30, '#1b2547'); hex(p[0], p[1], 12, '#e6c46a');
    });
    for (var k = 0; k < 40; k++) { x.fillStyle = ['#e6d6b8', '#1b2547', '#d9b46a'][k % 3]; var px = 80 + R() * (w - 160), py = 80 + R() * (h - 160); if (Math.abs(px - w / 2) > 110) x.fillRect(px, py, 9, 9); }
    for (var n = 0; n < 6000; n++) { x.fillStyle = 'rgba(0,0,0,' + R() * .08 + ')'; x.fillRect(R() * w, R() * h, 2, 2); }
  });

  // ---------- materials ----------
  var M = {
    plaster: new THREE.MeshStandardMaterial({ map: plasterTex, bumpMap: plasterTex, bumpScale: 0.004, roughness: .95 }),
    floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: .7 }),
    top: new THREE.MeshStandardMaterial({ map: woodLight, roughness: .55 }),
    ceiling: new THREE.MeshStandardMaterial({ map: woodDark, roughness: .9 }),
    stoolWood: new THREE.MeshStandardMaterial({ map: woodTex('#5a3a22', '#24140a'), roughness: .6 }),
    leather: new THREE.MeshStandardMaterial({ color: 0x8a5a3c, roughness: .75 }),
    pipe: new THREE.MeshStandardMaterial({ color: 0x3b2a20, metalness: .6, roughness: .5 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xc89b3c, metalness: 1, roughness: .28 }),
    jar: new THREE.MeshStandardMaterial({ color: 0x141110, roughness: .35, metalness: .2 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xe8dcc8, roughness: .3 }),
    led: new THREE.MeshBasicMaterial({ color: 0xffb466 }),
    leaf: new THREE.MeshStandardMaterial({ color: 0x4f7a3a, roughness: .8 }),
    leafDark: new THREE.MeshStandardMaterial({ color: 0x35582a, roughness: .8 }),
    rope: new THREE.MeshStandardMaterial({ color: 0xcdb48c, roughness: .9 }),
    carpet: new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1 })
  };

  function box(w, h, d, mat, x, y, z) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); scene.add(m); return m; }

  // ---------- room ----------
  var ROOM = { x0: -3, x1: 2.6, zBack: -1.6, zFront: 3, h: 3.2 };
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x1 - ROOM.x0, ROOM.zFront - ROOM.zBack), M.floor);
  floor.rotation.x = -Math.PI / 2; floor.position.set((ROOM.x0 + ROOM.x1) / 2, 0, (ROOM.zBack + ROOM.zFront) / 2); scene.add(floor);

  var backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x1 - ROOM.x0, ROOM.h), M.plaster);
  backWall.position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h / 2, ROOM.zBack); scene.add(backWall);
  var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.zFront - ROOM.zBack, ROOM.h), M.plaster);
  rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(ROOM.x1, ROOM.h / 2, (ROOM.zBack + ROOM.zFront) / 2); scene.add(rightWall);
  var leftWall = rightWall.clone(); leftWall.rotation.y = Math.PI / 2; leftWall.position.x = ROOM.x0; scene.add(leftWall);

  var ceilingGroup = new THREE.Group(); scene.add(ceilingGroup);
  var ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x1 - ROOM.x0, ROOM.zFront - ROOM.zBack), M.ceiling);
  ceil.rotation.x = Math.PI / 2; ceil.position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h, (ROOM.zBack + ROOM.zFront) / 2); ceilingGroup.add(ceil);
  [[-1.25, .09], [-0.85, .06], [0.6, .12]].forEach(function (p) {
    var c = new THREE.Mesh(new THREE.CylinderGeometry(p[1], p[1], ROOM.x1 - ROOM.x0, 20), M.pipe);
    c.rotation.z = Math.PI / 2; c.position.set((ROOM.x0 + ROOM.x1) / 2, ROOM.h - p[1] - .04, p[0]); ceilingGroup.add(c);
  });

  // ---------- sculpted plaster wall with niches ----------
  var niches = [
    { x0: -2.55, x1: -1.05, y0: 1.25, y1: 1.72 },
    { x0: -0.75, x1: 1.45, y0: 1.25, y1: 1.68 },
    { x0: -2.05, x1: -0.25, y0: 1.98, y1: 2.5 },
    { x0: 0.05, x1: 1.45, y0: 1.92, y1: 2.42 },
    { x0: -0.6, x1: 1.0, y0: 2.68, y1: 3.0 }
  ];
  function roundRect(path, x0, y0, x1, y1, r) {
    path.moveTo(x0 + r, y0); path.lineTo(x1 - r, y0); path.quadraticCurveTo(x1, y0, x1, y0 + r);
    path.lineTo(x1, y1 - r); path.quadraticCurveTo(x1, y1, x1 - r, y1); path.lineTo(x0 + r, y1);
    path.quadraticCurveTo(x0, y1, x0, y1 - r); path.lineTo(x0, y0 + r); path.quadraticCurveTo(x0, y0, x0 + r, y0);
  }
  var wallShape = new THREE.Shape();
  roundRect(wallShape, ROOM.x0 + .01, 0, 1.75, ROOM.h - .01, .02);
  niches.forEach(function (n) { var p = new THREE.Path(); roundRect(p, n.x0, n.y0, n.x1, n.y1, .1); wallShape.holes.push(p); });
  var WALL_D = 0.26;
  var wallGeo = new THREE.ExtrudeGeometry(wallShape, { depth: WALL_D, bevelEnabled: true, bevelThickness: .025, bevelSize: .025, bevelSegments: 4, curveSegments: 14 });
  var sculpt = new THREE.Mesh(wallGeo, M.plaster); sculpt.position.z = ROOM.zBack; scene.add(sculpt);
  var shelfZ = ROOM.zBack + WALL_D / 2;

  var nicheLights = [];
  niches.forEach(function (n, i) {
    var w = n.x1 - n.x0;
    // LED strip under niche top
    box(w - .2, .012, .02, M.led, (n.x0 + n.x1) / 2, n.y1 - .015, ROOM.zBack + WALL_D - .03);
    var jx = n.x0 + .12;
    while (jx < n.x1 - .12) {
      if (i === 2 && jx < n.x0 + .5) { jx += .1; continue; }
      var hgt = i === 3 ? .26 : .08 + R() * .08;
      var rad = i === 3 ? .045 : .035 + R() * .02;
      var mat = R() < .25 ? M.glass : M.jar;
      var j = new THREE.Mesh(i === 3 ? new THREE.BoxGeometry(.07, hgt, .09) : new THREE.CylinderGeometry(rad, rad, hgt, 16), mat);
      j.position.set(jx, n.y0 + hgt / 2, shelfZ); scene.add(j);
      jx += i === 3 ? .085 : rad * 2 + .03 + R() * .05;
    }
    if (i === 0 || i === 3) { var pl = new THREE.PointLight(0xffb26b, .5, 1.8, 2); pl.position.set((n.x0 + n.x1) / 2, n.y1 - .08, ROOM.zBack + WALL_D); scene.add(pl); nicheLights.push(pl); }
  });

  // samovar
  (function () {
    var pts = [[0, 0], [.07, 0], [.06, .03], [.04, .05], [.1, .1], [.12, .2], [.11, .3], [.07, .35], [.05, .37], [.07, .4], [.03, .45], [0, .46]].map(function (p) { return new THREE.Vector2(p[0], p[1]); });
    var s = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), M.gold);
    var n = niches[2]; s.position.set(n.x0 + .25, n.y0, shelfZ); s.scale.setScalar(.95); scene.add(s);
    var tap = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, .09, 8), M.gold); tap.rotation.x = Math.PI / 2; tap.position.set(n.x0 + .25, n.y0 + .1, shelfZ + .14); scene.add(tap);
  })();

  // ---------- bar counter ----------
  var BAR = { x0: -2.6, x1: 1.75, zFront: -0.28, depth: .6, h: 1.08 };
  box(BAR.x1 - BAR.x0, BAR.h - .06, BAR.depth - .1, new THREE.MeshStandardMaterial({ color: 0x2a1a12, roughness: .9 }), (BAR.x0 + BAR.x1) / 2, (BAR.h - .06) / 2, BAR.zFront - BAR.depth / 2 - .02);
  var top = box(BAR.x1 - BAR.x0 + .08, .06, BAR.depth + .08, M.top, (BAR.x0 + BAR.x1) / 2, BAR.h, BAR.zFront - BAR.depth / 2 + .04);
  box(BAR.x1 - BAR.x0, .012, .02, M.led, (BAR.x0 + BAR.x1) / 2, BAR.h - .045, BAR.zFront + .06);

  // terracotta fins (two staggered rows)
  (function () {
    var finW = .055, gap = .012, count = Math.floor((BAR.x1 - BAR.x0) / (finW + gap));
    var rows = [[.02, .52], [.54, 1.02]];
    var geo = new THREE.BoxGeometry(1, 1, 1);
    var mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .85 });
    var inst = new THREE.InstancedMesh(geo, mat, count * rows.length);
    var m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color(), k = 0;
    for (var r = 0; r < rows.length; r++) for (var i = 0; i < count; i++) {
      var d = .05 + .09 * (0.5 + 0.5 * Math.sin(i * 1.7 + r * 2.3)) + R() * .02;
      var h = rows[r][1] - rows[r][0];
      m.compose(new THREE.Vector3(BAR.x0 + i * (finW + gap) + finW / 2, rows[r][0] + h / 2, BAR.zFront + d / 2 - .02), q, new THREE.Vector3(finW, h, d));
      inst.setMatrixAt(k, m);
      c.setHSL(.03 + R() * .015, .6, .26 + R() * .05); inst.setColorAt(k, c); k++;
    }
    scene.add(inst);
  })();

  // ---------- bar stools ----------
  function stool(x, z, rot) {
    var g = new THREE.Group(); var SH = .74;
    function b(w, h, d, mat, px, py, pz, rx, rz) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(px, py, pz); m.rotation.set(rx || 0, 0, rz || 0); g.add(m); return m; }
    var lean = .06;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (s) {
      var back = s[1] < 0;
      var len = back ? 1.08 : SH;
      b(.038, len, .038, M.stoolWood, s[0] * (.18 + lean / 2), len / 2, s[1] * (.16 + lean / 2), s[1] * -lean / len * 1.0, s[0] * lean / len * 1.0);
    });
    b(.44, .035, .4, M.stoolWood, 0, SH, 0);
    b(.41, .035, .37, M.leather, 0, SH + .03, .01);
    b(.42, .15, .025, M.stoolWood, 0, 1.0, -.185, -.08);
    b(.38, .03, .03, M.stoolWood, 0, .28, .19);
    b(.03, .03, .34, M.stoolWood, -.2, .4, 0); b(.03, .03, .34, M.stoolWood, .2, .4, 0);
    g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
  }
  stool(-1.35, .18, Math.PI + .05); stool(-.35, .2, Math.PI - .04); stool(.65, .18, Math.PI + .08);

  // ---------- beaded hanging lamps ----------
  var lampLights = [];
  var shadeMat = new THREE.MeshStandardMaterial({ map: beadTex, emissiveMap: beadTex, emissive: 0xffffff, emissiveIntensity: .22, roughness: .6, side: THREE.DoubleSide });
  var fringeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 });
  function lamp(x, y, z, s) {
    var g = new THREE.Group(); g.position.set(x, y, z); g.scale.setScalar(s); scene.add(g);
    var shade = new THREE.Mesh(new THREE.CylinderGeometry(.27, .29, .38, 48, 1, true), shadeMat); g.add(shade);
    var rimGeo = new THREE.TorusGeometry(.29, .012, 8, 48);
    var rimB = new THREE.Mesh(rimGeo, M.gold); rimB.rotation.x = Math.PI / 2; rimB.position.y = -.19; g.add(rimB);
    var rimT = new THREE.Mesh(new THREE.TorusGeometry(.27, .012, 8, 48), M.gold); rimT.rotation.x = Math.PI / 2; rimT.position.y = .19; g.add(rimT);
    var N = 56, fr = new THREE.InstancedMesh(new THREE.CylinderGeometry(.006, .006, 1, 5), fringeMat, N), m = new THREE.Matrix4(), c = new THREE.Color();
    var cols = [0xc23a2b, 0x1f9aa6, 0xefe3cf, 0xe2a33a];
    for (var i = 0; i < N; i++) {
      var a = i / N * Math.PI * 2, len = .07 + (i % 2) * .05;
      m.compose(new THREE.Vector3(Math.cos(a) * .29, -.19 - len / 2, Math.sin(a) * .29), new THREE.Quaternion(), new THREE.Vector3(1, len, 1));
      fr.setMatrixAt(i, m); fr.setColorAt(i, c.setHex(cols[i % 4]));
    }
    g.add(fr);
    for (var t = 0; t < 4; t++) {
      var a2 = t / 4 * Math.PI * 2 + .4;
      var tas = new THREE.Mesh(new THREE.CylinderGeometry(.012, .025, .26, 10), M.glass);
      tas.position.set(Math.cos(a2) * .29, -.36, Math.sin(a2) * .29); g.add(tas);
      var cord = new THREE.Mesh(new THREE.CylinderGeometry(.004, .004, 1.2, 4), M.rope);
      cord.position.set(Math.cos(a2) * .2, .75, Math.sin(a2) * .2); cord.rotation.set(Math.sin(a2) * -.07, 0, Math.cos(a2) * .07); g.add(cord);
    }
    // plant on top
    for (var p = 0; p < 16; p++) {
      var lf = new THREE.Mesh(new THREE.SphereGeometry(.05 + R() * .04, 8, 6), R() < .5 ? M.leaf : M.leafDark);
      lf.scale.set(1, .5, 1.6); lf.position.set((R() - .5) * .4, .24 + R() * .2, (R() - .5) * .4); lf.rotation.y = R() * 6; g.add(lf);
    }
    for (var v = 0; v < 6; v++) {
      var vl = new THREE.Mesh(new THREE.SphereGeometry(.035, 6, 5), M.leaf);
      vl.scale.set(1, .5, 1.5); vl.position.set(.26 * Math.cos(v), .1 - v * .06, .26 * Math.sin(v)); g.add(vl);
    }
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(.05, 12, 10), M.led); bulb.position.y = -.05; g.add(bulb);
    var pl = new THREE.PointLight(0xffa860, 1.5, 4.2, 2); pl.position.set(x, y - .12, z); scene.add(pl); lampLights.push(pl);
  }
  lamp(-1.75, 2.55, -.6, 1); lamp(-.6, 2.45, -.62, 1.05); lamp(.55, 2.55, -.58, .95); lamp(1.6, 2.5, -.4, 1);

  // carpet on right wall
  var carpet = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.85), M.carpet);
  carpet.rotation.y = -Math.PI / 2; carpet.position.set(ROOM.x1 - .015, 2.05, -.75); scene.add(carpet);
  for (var f = 0; f < 30; f++) { var fr2 = box(.006, .05, .006, M.glass, ROOM.x1 - .02, 1.1, -.75 - .6 + f * .042); }

  // wall greenery left
  for (var gi = 0; gi < 24; gi++) {
    var lf2 = new THREE.Mesh(new THREE.SphereGeometry(.06 + R() * .04, 8, 6), R() < .5 ? M.leaf : M.leafDark);
    lf2.scale.set(1, .5, 1.6); lf2.position.set(-2.75 + (R() - .5) * .3, 2.9 - R() * .9, -1.25 + R() * .3); scene.add(lf2);
  }

  // floor uplights at fins
  var floorLights = [-1.6, .2].map(function (x) { var pl = new THREE.PointLight(0xff9d55, .7, 1.6, 2); pl.position.set(x, .06, BAR.zFront + .45); scene.add(pl); return pl; });
  box(BAR.x1 - BAR.x0, .01, .03, M.led, (BAR.x0 + BAR.x1) / 2, .005, BAR.zFront + .16);

  // ---------- ambient / day mode ----------
  var hemi = new THREE.HemisphereLight(0xffe6c8, 0x2a1a10, .32); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1dc, 0); sun.position.set(2, 4, 4); scene.add(sun);
  function setMode(mode) {
    var day = mode === 'day';
    hemi.intensity = day ? .9 : .16; sun.intensity = day ? .9 : 0;
    lampLights.forEach(function (l) { l.intensity = day ? .4 : 1.0; });
    nicheLights.concat(floorLights).forEach(function (l) { l.intensity = day ? .2 : (l.distance < 1.7 ? .7 : .5); });
    shadeMat.emissiveIntensity = day ? .04 : .14;
    renderer.toneMappingExposure = day ? .9 : .8;
  }

  // ---------- camera presets ----------
  var VIEWS = {
    overview: { p: [.5, 1.55, 3.4], t: [-.2, 1.55, -.9] },
    bar: { p: [-.5, 1.3, 1.7], t: [-.3, 1.55, -1.3] },
    side: { p: [2.1, 1.6, 1.7], t: [-.6, 1.5, -1] },
    top: { p: [-.2, 7.2, .9], t: [-.2, 0, .2] }
  };
  var tween = null;
  function goTo(name, instant) {
    var v = VIEWS[name];
    ceilingGroup.visible = name !== 'top';
    var to = { p: new THREE.Vector3().fromArray(v.p), t: new THREE.Vector3().fromArray(v.t) };
    if (instant) { camera.position.copy(to.p); controls.target.copy(to.t); controls.update(); return; }
    tween = { from: { p: camera.position.clone(), t: controls.target.clone() }, to: to, k: 0 };
  }
  function bindGroup(id, attr, fn) {
    var g = document.getElementById(id);
    g.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      fn(b.dataset[attr]);
    });
  }
  bindGroup('views', 'view', function (v) { goTo(v); });
  bindGroup('modes', 'mode', setMode);
  controls.addEventListener('start', function () { tween = null; if (camera.position.y < 5) ceilingGroup.visible = true; });

  // ---------- loop ----------
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < h ? 68 : 52; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();
  setMode('evening'); goTo('overview', true);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame() {
    if (tween) {
      tween.k = reduce ? 1 : Math.min(1, tween.k + 0.035);
      var e = 1 - Math.pow(1 - tween.k, 3);
      camera.position.lerpVectors(tween.from.p, tween.to.p, e);
      controls.target.lerpVectors(tween.from.t, tween.to.t, e);
      if (tween.k >= 1) tween = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
