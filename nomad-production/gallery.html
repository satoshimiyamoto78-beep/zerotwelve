<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nomad Gallery</title>
<meta name="description" content="Every Nomad Production title in one place: AI films, hybrid and edits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #05070c; --ink: #fff; --muted: rgba(255,255,255,.62); --dim: rgba(255,255,255,.4); --blue: #2f6bff; --blue-2: #8fb2ff; --font: "Plus Jakarta Sans", system-ui, sans-serif; --gut: max(22px, env(safe-area-inset-left, 0px)); --grad: linear-gradient(95deg, #ffffff, #8fb2ff 45%, #2f6bff); color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
html { scrollbar-width: none; } html::-webkit-scrollbar { display: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: inherit; }
.wrap { max-width: 1340px; margin: 0 auto; padding: 0 var(--gut); }
header { position: sticky; top: 0; z-index: 10; background: rgba(5,7,12,.96); }
.bar { height: 56px; display: flex; align-items: center; justify-content: space-between; }
.logo { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-weight: 800; font-size: .9rem; letter-spacing: -.02em; }
.logo svg { width: 26px; height: 26px; }
.logo small { display: block; font-size: .5rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 1px; }
.logo > span { line-height: 1; }
.back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: .84rem; font-weight: 600; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); }
.back svg.i { width: 15px; height: 15px; }
.head { padding: clamp(56px, 9vw, 120px) 0 clamp(28px, 4vw, 48px); }
.label { font-size: .66rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--blue-2); }
h1 { font-size: clamp(2.4rem, 6vw, 5rem); letter-spacing: -.045em; line-height: 1; margin-top: 12px; }
h1 em { font-style: normal; color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text; }
.lede { color: var(--muted); max-width: 52ch; margin-top: 16px; line-height: 1.6; }
.filters { position: sticky; top: 56px; z-index: 9; background: var(--bg); padding: 10px 0 14px; display: grid; gap: 10px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; position: relative; border-bottom: 1px solid rgba(255,255,255,.08); }
.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 .9rem var(--font); padding: 10px 12px 12px; cursor: pointer; position: relative; }
.tabs button:first-child { padding-left: 0; }
.tabs button[aria-pressed="true"] { color: #fff; }
.tabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--grad); box-shadow: 0 0 10px rgba(80,140,255,.6); }
.tabs button:first-child[aria-pressed="true"]::after { left: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.14); background: none; color: #fff; font: 600 .8rem var(--font); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: #fff; color: #05070c; border-color: #fff; }
.chip svg.i { width: 15px; height: 15px; }
.count { font-size: .78rem; color: var(--dim); margin-top: 2px; }
.grid { columns: 4 260px; column-gap: clamp(14px, 2vw, 24px); padding: 18px 0 clamp(64px, 8vw, 120px); }
.item { break-inside: avoid; display: block; text-decoration: none; margin-bottom: clamp(18px, 2.4vw, 30px); opacity: 0; transform: translateY(18px); filter: blur(8px); transition: opacity .7s ease, transform .8s cubic-bezier(.2,.7,.2,1), filter .8s; }
.item.in { opacity: 1; transform: none; filter: none; }
.item .ph { position: relative; border-radius: 18px; overflow: hidden; background: #0b0f18; }
.item img { width: 100%; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
@media (hover: hover) { .item:hover img { transform: scale(1.04); } }
.item .tag { position: absolute; left: 10px; top: 10px; font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(5,7,12,.7); border: 1px solid rgba(255,255,255,.18); }
.item .dur { position: absolute; right: 10px; top: 10px; font-size: .64rem; font-weight: 700; padding: 5px 8px; border-radius: 999px; background: rgba(5,7,12,.7); }
.item .meta { display: flex; justify-content: space-between; gap: 10px; padding-top: 10px; }
.item b { font-size: .96rem; letter-spacing: -.01em; }
.item small { display: block; font-size: .74rem; color: var(--muted); margin-top: 2px; }
.item .pr { font-weight: 700; font-size: .92rem; white-space: nowrap; }
.empty { color: var(--muted); padding: 40px 0; }
footer { border-top: 1px solid rgba(255,255,255,.08); padding: 28px 0 40px; color: var(--dim); font-size: .78rem; display: flex; justify-content: space-between; }
@media (prefers-reduced-motion: reduce) { .item { opacity: 1; transform: none; filter: none; transition: none; } }
</style>
</head>
